<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Gamer</title>
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Estilo Personalizado -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Imagens Ampliadas e Destacadas em Volta da Tela -->
    <div class="fundo-decorativo">
        <!-- Superior Esquerdo -->
        <div class="card-imagem pos-top-left float-slow">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1000&q=80" alt="Esports Gaming">
            <div class="overlay-gradient"></div>
        </div>

        <!-- Superior Direito -->
        <div class="card-imagem pos-top-right float-delayed">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1000&q=80" alt="Arcade Gaming">
            <div class="overlay-gradient"></div>
        </div>

        <!-- Inferior Esquerdo -->
        <div class="card-imagem pos-bottom-left float-reverse">
            <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1000&q=80" alt="Gamer Keyboard">
            <div class="overlay-gradient"></div>
        </div>

        <!-- Inferior Direito -->
        <div class="card-imagem pos-bottom-right float-slow-delayed">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1000&q=80" alt="Retro Gaming Hardware">
            <div class="overlay-gradient"></div>
        </div>

        <!-- Desenhos / Ícones Gamer Flutuantes Expandidos -->
        <i class="fa-solid fa-gamepad icon-game pos-icon-1 float-slow"></i>
        <i class="fa-solid fa-ghost icon-game pos-icon-2 float-delayed"></i>
        <i class="fa-solid fa-dice-d20 icon-game pos-icon-3 float-reverse"></i>
        <i class="fa-solid fa-headset icon-game pos-icon-4 float-slow-delayed"></i>
    </div>

    <!-- Container Principal Gamer -->
    <main class="container-principal animate-card animated-glow">
        
        <header class="cabecalho">
            <div class="icone-cabecalho">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <h1>Senha Gamer</h1>
            <p>Gere senhas lendárias em formato Leetspeak para proteger as tuas contas de jogos.</p>
        </header>

        <!-- Campo de Exibição da Senha Gerada -->
        <div class="caixa-senha">
            <span id="passwordOutput">Clique em Gerar</span>
            <button id="btnCopiar" onclick="copyPassword()" title="Copiar senha">
                <i id="copyIcon" class="fa-regular fa-copy"></i>
            </button>
        </div>

        <!-- Opções de Configuração -->
        <div class="painel-opcoes">
            <div class="campo-grupo">
                <label for="baseWordInput">Palavra Base (Opcional)</label>
                <input type="text" id="baseWordInput" placeholder="Ex: streamer, guerreiro, dragao...">
            </div>

            <div class="grade-checks">
                <label class="item-check">
                    <input type="checkbox" id="addSymbols" checked>
                    <span>Adicionar Símbolos</span>
                </label>
                <label class="item-check">
                    <input type="checkbox" id="addNumbers" checked>
                    <span>Misturar Números</span>
                </label>
            </div>
        </div>

        <!-- Botão Gerar -->
        <button id="generateBtn" onclick="generatePassword()">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Gerar Senha Gamer</span>
        </button>

        <!-- Rodapé / Indicador de Segurança -->
        <footer class="rodape-status">
            <span>Nível de Proteção: <strong id="strengthText" class="status-medio">Média</strong></span>
            <span class="tag-player"><i class="fa-solid fa-trophy"></i> Player 1 Ready</span>
        </footer>

    </main>

    <!-- Script JavaScript -->
    <script src="./main.js"></script>
</body>
</html>
